<!DOCTYPE html>
<html lang="kn">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Test Dashboard - Chaithanya Career Academy</title>
    
    <!-- 1. ಲಾಗಿನ್ ಚೆಕ್ ಆಗುವವರೆಗೆ ಪೇಜ್ ಮುಚ್ಚಿಡಲು (Cache Control & Hide) -->
    <meta http-equiv="Cache-Control" content="no-store, no-cache, must-revalidate, max-age=0">
    <meta http-equiv="Pragma" content="no-cache">
    <style>
        /* ಆರಂಭದಲ್ಲಿ ಪೇಜ್ ಹೈಡ್ ಆಗಿರಲು */
        body { display: none; } 
    </style>

    <style>
        body {
    -webkit-user-select: none; /* Safari, Chrome */
    -ms-user-select: none; /* IE, Edge */
    user-select: none; /* Standard */
}

        /* ಆಕರ್ಷಕ ಹಿನ್ನೆಲೆ ಬಣ್ಣ */
        body { 
            font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif; 
            background: linear-gradient(135deg, #f5f7fa 0%, #c3cfe2 100%); 
            margin: 0; 
            padding: 50px 20px; 
            /* JavaScript ನಿಂದ ಇದು flex ಆಗಿ ಬದಲಾಗುತ್ತದೆ */
            justify-content: center; 
            align-items: center; 
            min-height: 100vh;
            box-sizing: border-box;
        }
        
        /* ಮುಖ್ಯ ಬಿಳಿ ಬಾಕ್ಸ್ */
        .dashboard-container { 
            background: #ffffff; 
            border-radius: 20px; 
            box-shadow: 0 20px 50px rgba(0,0,0,0.1); 
            padding: 50px 40px; 
            max-width: 900px; 
            width: 100%;
            text-align: center; 
        }

        /* ಟೈಟಲ್ ಗ್ರೇಡಿಯಂಟ್ ಬಣ್ಣ */
        .main-title { 
            font-size: 38px; 
            font-weight: 900; 
            margin-bottom: 10px; 
            background: linear-gradient(45deg, #2c3e50, #3498db); 
            -webkit-background-clip: text; 
            background-clip: text;
            -webkit-text-fill-color: transparent; 
        }
        .sub-title { 
            color: #7f8c8d; 
            font-weight: bold; 
            letter-spacing: 2px; 
            margin-bottom: 50px; 
            font-size: 16px;
        }

        .card-grid { 
            display: flex; 
            gap: 30px; 
            justify-content: center; 
            flex-wrap: wrap; 
            margin-bottom: 50px; 
        }

        /* ಟೆಸ್ಟ್ ಬಾಕ್ಸ್‌ಗಳ ಸಾಮಾನ್ಯ ವಿನ್ಯಾಸ */
        .category-card { 
            flex: 1; 
            min-width: 280px; 
            padding: 40px 20px; 
            border-radius: 16px; 
            text-decoration: none; 
            color: white; 
            transition: all 0.4s cubic-bezier(0.175, 0.885, 0.32, 1.275); 
            position: relative; 
            overflow: hidden; 
        }
        
        /* ಮೌಸ್ ತಂದಾಗ ಮೇಲಕ್ಕೆ ಬರುವ ಎಫೆಕ್ಟ್ */
        .category-card:hover { 
            transform: translateY(-12px); 
        }

        /* PSTR ಆರೆಂಜ್ ಗ್ರೇಡಿಯಂಟ್ */
        .card-pstr { 
            background: linear-gradient(135deg, #FF512F 0%, #F09819 100%); 
            box-shadow: 0 15px 30px rgba(240, 152, 25, 0.4); 
        }
        
        /* UGC NET ನೇರಳೆ ಗ್ರೇಡಿಯಂಟ್ */
        .card-ugc { 
            background: linear-gradient(135deg, #8E2DE2 0%, #4A00E0 100%); 
            box-shadow: 0 15px 30px rgba(142, 45, 226, 0.4); 
        }

        .category-card h3 { 
            font-size: 26px; 
            margin: 0 0 15px 0; 
            text-shadow: 1px 1px 3px rgba(0,0,0,0.2); 
        }
        .category-card p { 
            font-size: 16px; 
            margin: 0; 
            opacity: 0.9; 
            font-weight: 500;
        }

        /* ಹೋಮ್ ಬಟನ್ ವಿನ್ಯಾಸ */
        .btn-home { 
            display: inline-block; 
            padding: 12px 30px; 
            background: #0984e3; 
            color: #2f3542; 
            text-decoration: none; 
            font-weight: bold; 
            border-radius: 30px; 
            transition: 0.3s; 
            box-shadow: 0 4px 6px rgba(0,0,0,0.05);
        }
        .btn-home:hover { 
            background: #076bb8; 
            transform: scale(1.05); 
        }
    </style>
</head>
<body>

    <div class="dashboard-container">
        <h2 class="main-title">Chaithanya Career Academy</h2>
        <p class="sub-title">SELECT TEST CATEGORY</p>
        
        <div class="card-grid">
            <!-- PSTR ಬಾಕ್ಸ್ -->
            <a href="pstr-dashboard.html" class="category-card card-pstr">
                <h3>PSTR / GPSTR / HSTR</h3>
                <p>Click to view mock tests 🎯</p>
            </a>

            <!-- UGC NET ಬಾಕ್ಸ್ -->
            <a href="ugc-net-kset.html" class="category-card card-ugc">
                <h3>UGC NET / KSET</h3>
                <p>Paper 1 & Paper 2 (Commerce) 📚</p>
            </a>
        </div>

        <a href="index.html" class="btn-home">🏠 BACK TO HOME</a>
    </div>

    <script>
    // ============================================
    // 2. ಲಾಗಿನ್ ಪರಿಶೀಲನೆ (Login Enforcement)
    // ============================================
    async function enforceLogin() {
        try {
            const response = await fetch('/check-login', { cache: "no-store" });
            const data = await response.json();
            
            if (!data.loggedIn) {
                alert("ಈ ಪುಟವನ್ನು ನೋಡಲು ದಯವಿಟ್ಟು ಲಾಗಿನ್ ಮಾಡಿ!");
                // ಲಾಗಿನ್ ಆದ ನಂತರ ವಾಪಸ್ ಇದೇ ಪುಟಕ್ಕೆ ಬರಲು redirect ಸೆಟ್ ಮಾಡಲಾಗಿದೆ
                window.location.replace("login.html?redirect=/test-dashboard.html"); 
            } else {
                // ಲಾಗಿನ್ ಆಗಿದ್ದರೆ ಮಾತ್ರ ಪೇಜ್ ಅನ್ನು ತೋರಿಸುವುದು (ನಿಮ್ಮ ವಿನ್ಯಾಸದಂತೆ 'flex' ಬಳಸಲಾಗಿದೆ)
                document.body.style.display = "flex";
            }
        } catch (error) {
            window.location.replace("login.html?redirect=/test-dashboard.html");
        }
    }

    enforceLogin();

    // ಬ್ಯಾಕ್ ಬಟನ್ (Bfcache) ಒತ್ತಿದಾಗ ಪೇಜ್ ಅನ್ನು ಕಡ್ಡಾಯವಾಗಿ ರಿಫ್ರೆಶ್ ಮಾಡಲು
    window.addEventListener("pageshow", function (event) {
        if (event.persisted) {
            window.location.reload();
        }
    });

    // ============================================
    // 3. ನಿಮ್ಮ ಹಳೆಯ ಭದ್ರತಾ ಸ್ಕ್ರಿಪ್ಟ್‌ಗಳು (ಯಾವುದೇ ಬದಲಾವಣೆ ಇಲ್ಲ)
    // ============================================
    // 1. ರೈಟ್-ಕ್ಲಿಕ್ ತಡೆಯಲು
    document.addEventListener('contextmenu', event => event.preventDefault());

    // 2. ಮೌಸ್ ಮೂಲಕ Copy ಮಾಡುವುದನ್ನು ತಡೆಯಲು
    document.addEventListener('copy', event => {
        event.preventDefault();
    });

    // 3. ಕೀಬೋರ್ಡ್ ಶಾರ್ಟ್‌ಕಟ್‌ಗಳನ್ನು ತಡೆಯಲು
    document.onkeydown = function(e) {
        // F12 ತಡೆಯಲು
        if (e.keyCode == 123) return false;
        
        // Ctrl+Shift+I, Ctrl+Shift+C, Ctrl+Shift+J ತಡೆಯಲು
        if (e.ctrlKey && e.shiftKey && (e.keyCode == 'I'.charCodeAt(0) || e.keyCode == 'C'.charCodeAt(0) || e.keyCode == 'J'.charCodeAt(0))) {
            return false;
        }
        
        // Ctrl+U (View Source) ತಡೆಯಲು
        if (e.ctrlKey && e.keyCode == 'U'.charCodeAt(0)) return false;
        
        // Ctrl+C (Copy) ತಡೆಯಲು
        if (e.ctrlKey && e.keyCode == 'C'.charCodeAt(0)) return false;
        
        // Ctrl+P (Print) ತಡೆಯಲು
        if (e.ctrlKey && e.keyCode == 'P'.charCodeAt(0)) return false;

    };

    </script>

</body>
</html>
