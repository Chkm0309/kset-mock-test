<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>UGC NET / KSET - Chaithanya Career Academy</title>
    <style>

        body {
    -webkit-user-select: none; /* Safari, Chrome */
    -ms-user-select: none; /* IE, Edge */
    user-select: none; /* Standard */
        }

        body {
            background-color: #e8f0fe; /* ನೀವು ಆಯ್ಕೆ ಮಾಡಿದ ತಿಳಿ ನೀಲಿ ಬ್ಯಾಕ್‌ಗ್ರೌಂಡ್ */
            font-family: Arial, sans-serif;
            margin: 0;
            padding: 0;
        }

        .container {
            text-align: center;
            padding: 60px 20px;
        }

        .page-title {
            color: #2c3e50;
            font-size: 32px;
            font-weight: 900;
            margin-bottom: 40px;
            text-transform: uppercase;
            letter-spacing: 1px;
        }

        .paper-wrapper {
            display: flex;
            justify-content: center;
            gap: 50px;
            flex-wrap: wrap;
        }

        .paper-card {
            background-color: #ffffff;
            padding: 50px 30px;
            border-radius: 16px;
            text-align: center;
            width: 340px;
            text-decoration: none;
            transition: all 0.4s cubic-bezier(0.175, 0.885, 0.32, 1.275); /* ಬಾನ್ಸ್ ಆಗುವ ಸ್ಮೂತ್ ಎಫೆಕ್ಟ್ */
            cursor: pointer;
            border: 2px solid transparent;
        }

        /* 1ನೇ ಪೇಪರ್: ನೀಲಿ ಬಣ್ಣದ ಥೀಮ್ */
        .paper-1 {
            border-bottom: 6px solid #0984e3;
        }
        .paper-1 h2 {
            color: #0984e3;
            font-size: 32px;
            font-weight: 900; /* ಅತ್ಯಂತ ಬೋಲ್ಡ್ ಅಕ್ಷರಗಳು */
            margin: 0 0 10px 0;
        }
        .paper-1 p {
            color: #2d3436;
            font-size: 20px;
            font-weight: bold;
        }
        .paper-1:hover {
            transform: translateY(-12px);
            box-shadow: 0 20px 35px rgba(9, 132, 227, 0.25);
            border-color: #0984e3;
        }

        /* 2ನೇ ಪೇಪರ್: ಕೆಂಪು/ಕಿತ್ತಳೆ ಬಣ್ಣದ ಥೀಮ್ */
        .paper-2 {
            border-bottom: 6px solid #d63031;
        }
        .paper-2 h2 {
            color: #d63031;
            font-size: 32px;
            font-weight: 900;
            margin: 0 0 10px 0;
        }
        .paper-2 p {
            color: #2d3436;
            font-size: 20px;
            font-weight: bold;
        }
        .paper-2:hover {
            transform: translateY(-12px);
            box-shadow: 0 20px 35px rgba(214, 48, 49, 0.25);
            border-color: #d63031;
        }

        .back-btn {
            display: inline-block;
            margin-top: 50px;
            padding: 10px 25px;
            background-color: #ffffff;
            color: #0056b3;
            text-decoration: none;
            font-weight: bold;
            border-radius: 8px;
            box-shadow: 0 4px 6px rgba(0,0,0,0.05);
            transition: 0.3s;
        }
        .back-btn:hover {
            background-color: #0056b3;
            color: #ffffff;
        }
    </style>
</head>
<body>

    <div class="container">
        <h1 class="page-title">UGC NET / KSET </h1>
        
        <div class="paper-wrapper">
            <!-- Paper 1 Box -->
            <a href="paper-tests.html?subject=paper1" class="paper-card paper-1">
                <h2>PAPER 1</h2>
                <p>GENERAL STUDIES</p>
            </a>

            <!-- Paper 2 Box -->
            <a href="paper-tests.html?subject=paper2" class="paper-card paper-2">
                <h2>PAPER 2</h2>
                <p>COMMERCE</p>
            </a>
        </div>

        <a href="test-dashboard.html" class="back-btn">⬅ Back to Dashboard</a>
    </div>

    <script>
    // 1. ರೈಟ್-ಕ್ಲಿಕ್ ತಡೆಯಲು
    document.addEventListener('contextmenu', event => event.preventDefault());

    // 2. ಮೌಸ್ ಮೂಲಕ Copy ಮಾಡುವುದನ್ನು ತಡೆಯಲು
    document.addEventListener('copy', event => {
        event.preventDefault();
    });

    // 3. ಕೀಬೋರ್ಡ್ ಶಾರ್ಟ್‌ಕಟ್‌ಗಳನ್ನು ತಡೆಯಲು
    document.onkeydown = function(e) {
        // F12 ತಡೆಯಲು
        if (e.keyCode == 123) return false;
        
        // Ctrl+Shift+I, Ctrl+Shift+C, Ctrl+Shift+J ತಡೆಯಲು
        if (e.ctrlKey && e.shiftKey && (e.keyCode == 'I'.charCodeAt(0) || e.keyCode == 'C'.charCodeAt(0) || e.keyCode == 'J'.charCodeAt(0))) {
            return false;
        }
        
        // Ctrl+U (View Source) ತಡೆಯಲು
        if (e.ctrlKey && e.keyCode == 'U'.charCodeAt(0)) return false;
        
        // Ctrl+C (Copy) ತಡೆಯಲು
        if (e.ctrlKey && e.keyCode == 'C'.charCodeAt(0)) return false;
        
        // Ctrl+P (Print) ತಡೆಯಲು
        if (e.ctrlKey && e.keyCode == 'P'.charCodeAt(0)) return false;
    };
</script>

</body>
</html>
