<!DOCTYPE html>
<html lang="kn">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Mock Tests - Chaithanya Career Academy</title>
    <style>
        body {
    -webkit-user-select: none; /* Safari, Chrome */
    -ms-user-select: none; /* IE, Edge */
    user-select: none; /* Standard */
}
        body { font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif; background-color: #e8f0fe; margin: 0; padding: 40px 20px; display: flex; justify-content: center; }
        .container { width: 100%; max-width: 1100px; background: transparent; }
        .section-title { color: #2c3e50; font-size: 32px; font-weight: 900; text-align: center; margin-bottom: 40px; text-transform: uppercase; letter-spacing: 1px; }
        .grid-container { display: grid; grid-template-columns: repeat(auto-fit, minmax(320px, 1fr)); gap: 30px; }
        .test-box { background: #ffffff; border-radius: 16px; padding: 30px; text-align: center; border-bottom: 6px solid #0984e3; box-shadow: 0 4px 6px rgba(0,0,0,0.05); transition: all 0.4s cubic-bezier(0.175, 0.885, 0.32, 1.275); display: flex; flex-direction: column; justify-content: space-between; }
        .test-box:hover { transform: translateY(-10px); box-shadow: 0 20px 35px rgba(9, 132, 227, 0.15); }
        .test-title { font-size: 24px; font-weight: 900; color: #0984e3; margin-bottom: 15px; }
        .test-details { font-size: 16px; color: #2d3436; font-weight: bold; line-height: 2; margin-bottom: 25px; background: #f8f9fa; padding: 15px; border-radius: 8px; }
        
        .btn-start { display: block; width: 100%; padding: 14px; background-color: #28a745; color: white; text-decoration: none; border-radius: 8px; font-weight: bold; font-size: 16px; transition: 0.3s; box-sizing: border-box; border: none; }
        .btn-start:hover { background-color: #218838; }
        .btn-group { display: flex; gap: 15px; width: 100%; }
        .btn-reattempt { flex: 1; background: #f39c12; color: white; padding: 14px; border-radius: 8px; text-decoration: none; font-weight: bold; transition: 0.3s; }
        .btn-reattempt:hover { background: #d68910; }
        .btn-result { flex: 1; background: #2ecc71; color: white; padding: 14px; border-radius: 8px; text-decoration: none; font-weight: bold; transition: 0.3s; }
        .btn-result:hover { background: #27ae60; }

        .btn-back { display: inline-block; margin-bottom: 30px; padding: 10px 25px; background-color: #ffffff; color: #0056b3; text-decoration: none; font-weight: bold; border-radius: 8px; box-shadow: 0 4px 6px rgba(0,0,0,0.05); transition: 0.3s; }
        .btn-back:hover { background-color: #0056b3; color: #ffffff; }
    </style>
</head>
<body>
    <div class="container">
        <a href="ugc-net-kset.html" id="dynamic-back-btn" class="btn-back">⬅ Back to Papers</a>
        
        <!-- ಜಾವಾಸ್ಕ್ರಿಪ್ಟ್ ಮೂಲಕ ಈ ಹೆಡ್ಡಿಂಗ್ ಆಟೋಮ್ಯಾಟಿಕ್ ಆಗಿ ಬದಲಾಗುತ್ತದೆ -->
        <h2 class="section-title" id="page-main-title">UGC NET - MOCK TESTS</h2>
        
        <div class="grid-container" id="tests-grid">
            <p style="text-align: center; width: 100%; font-weight: bold; color: #555;">Loading Mock Tests...</p>
        </div>
    </div>

    <script>
    // 1. URL ನಿಂದ ಯಾವ ವಿಭಾಗ ಎಂದು ಓದುವುದು
    const urlParams = new URLSearchParams(window.location.search);
    const currentSubject = urlParams.get('subject') || 'paper1';

    // ಹೊಸ ಕೋಡ್: ವಿಭಾಗಕ್ಕೆ ತಕ್ಕಂತೆ Back ಬಟನ್ ಲಿಂಕ್ ಬದಲಾಯಿಸುವುದು
    const backBtn = document.getElementById('dynamic-back-btn');
    if (currentSubject.includes('pstr')) {
        backBtn.href = "pstr-dashboard.html";
    } else {
        backBtn.href = "ugc-net-kset.html";
    }

    // 2. ವಿಭಾಗಕ್ಕೆ ತಕ್ಕಂತೆ ಮೇಲಿರುವ ಹೆಡ್ಡಿಂಗ್ ಬದಲಾಯಿಸುವುದು
    const pageTitle = document.getElementById('page-main-title');
    if (currentSubject === 'paper2') {
        pageTitle.innerText = "UGC NET PAPER 2 (COMMERCE) - MOCK TESTS";
    } else if (currentSubject === 'pstr-paper1') {
        pageTitle.innerText = "PSTR PAPER 1 (GENERAL) - MOCK TESTS";
    } else if (currentSubject === 'pstr-paper2') {
        pageTitle.innerText = "PSTR PAPER 2 (PHYSICS & MATHS) - MOCK TESTS";
    } else {
        pageTitle.innerText = "UGC NET PAPER 1 - MOCK TESTS";
    }

    async function loadTests() {
        try {
            const testResponse = await fetch('/api/test-details');
            const testData = await testResponse.json();
            
            const resultResponse = await fetch('/get-my-results');
            if (resultResponse.status === 401) {
                window.location.href = "login.html"; return;
            }
            const results = await resultResponse.json();

            const gridContainer = document.getElementById('tests-grid');
            gridContainer.innerHTML = ''; 

            if (testData.success && testData.tests.length > 0) {
                
                // 3. URL ಗೆ ತಕ್ಕಂತೆ ಡೇಟಾಬೇಸ್‌ನಿಂದ ಟೆಸ್ಟ್‌ಗಳನ್ನು ಫಿಲ್ಟರ್ ಮಾಡುವುದು
                const filteredTests = testData.tests.filter(t => {
                    if (currentSubject === 'paper2') {
                        return t.testId.includes('Paper2') || t.testId.includes('Commerce');
                    } else if (currentSubject === 'pstr-paper1') {
                        return t.testId.includes('PSTR_Paper1') || t.testId.includes('GPSTR_Paper1');
                    } else if (currentSubject === 'pstr-paper2') {
                        return t.testId.includes('PSTR_Paper2') || t.testId.includes('Physics');
                    } else {
                        // UGC NET Paper 1
                        return t.testId.includes('Paper1') && !t.testId.includes('PSTR') && !t.testId.includes('GPSTR');
                    }
                });

                if(filteredTests.length === 0) {
                    gridContainer.innerHTML = '<p style="text-align:center; width:100%; font-weight:bold;">ಈ ವಿಭಾಗದ ಪರೀಕ್ಷೆಗಳು ಶೀಘ್ರದಲ್ಲೇ ಬರಲಿವೆ...</p>';
                    return;
                }

                filteredTests.forEach(test => {
                    const hasCompleted = results.find(result => result.testName === test.testId);
                    let actionButtons = '';

                    if (hasCompleted) {
                        actionButtons = `
                            <div class="btn-group">
                                <a href="mocktest.html?test=${test.testId}" class="btn-reattempt">Re-Attempt 🔄</a>
                                <a href="result.html?test=${test.testId}" class="btn-result">Result 📊</a>
                            </div>`;
                    } else {
                        actionButtons = `
                            <a href="mocktest.html?test=${test.testId}" class="btn-start">Start Test (ಪ್ರಾರಂಭಿಸಿ)</a>`;
                    }

                    const boxHTML = `
                        <div class="test-box">
                            <div>
                                <div class="test-title">${test.title}</div>
                                <div class="test-details">
                                    📝 ಒಟ್ಟು ಪ್ರಶ್ನೆಗಳು: ${test.qCount} <br>
                                    ⏱️ ಸಮಯ: ${test.time} ನಿಮಿಷಗಳು <br>
                                    💯 ಅಂಕಗಳು: ${test.marks}
                                </div>
                            </div>
                            <div class="test-action-buttons">
                                ${actionButtons}
                            </div>
                        </div>
                    `;
                    gridContainer.innerHTML += boxHTML;
                });
            } else {
                gridContainer.innerHTML = '<p style="text-align:center; width:100%;">ಯಾವುದೇ ಪರೀಕ್ಷೆಗಳು ಲಭ್ಯವಿಲ್ಲ.</p>';
            }
        } catch (error) {
            console.error("ಎರರ್:", error);
            document.getElementById('tests-grid').innerHTML = '<p style="text-align:center; color:red;">ಡೇಟಾಬೇಸ್ ಸಂಪರ್ಕದಲ್ಲಿ ದೋಷವಿದೆ.</p>';
        }
    }
    window.onload = loadTests;

    
    // 1. ರೈಟ್-ಕ್ಲಿಕ್ ತಡೆಯಲು
    document.addEventListener('contextmenu', event => event.preventDefault());

    // 2. ಮೌಸ್ ಮೂಲಕ Copy ಮಾಡುವುದನ್ನು ತಡೆಯಲು
    document.addEventListener('copy', event => {
        event.preventDefault();
    });

    // 3. ಕೀಬೋರ್ಡ್ ಶಾರ್ಟ್‌ಕಟ್‌ಗಳನ್ನು ತಡೆಯಲು
    document.onkeydown = function(e) {
        // F12 ತಡೆಯಲು
        if (e.keyCode == 123) return false;
        
        // Ctrl+Shift+I, Ctrl+Shift+C, Ctrl+Shift+J ತಡೆಯಲು
        if (e.ctrlKey && e.shiftKey && (e.keyCode == 'I'.charCodeAt(0) || e.keyCode == 'C'.charCodeAt(0) || e.keyCode == 'J'.charCodeAt(0))) {
            return false;
        }
        
        // Ctrl+U (View Source) ತಡೆಯಲು
        if (e.ctrlKey && e.keyCode == 'U'.charCodeAt(0)) return false;
        
        // Ctrl+C (Copy) ತಡೆಯಲು
        if (e.ctrlKey && e.keyCode == 'C'.charCodeAt(0)) return false;
        
        // Ctrl+P (Print) ತಡೆಯಲು
        if (e.ctrlKey && e.keyCode == 'P'.charCodeAt(0)) return false;
    };

    </script>
</body>
</html>
