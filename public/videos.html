<!DOCTYPE html>
<html lang="kn">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Video Classes - Chaithanya Career Academy</title>
    <style>
        body { font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif; background: #f9f9f9; padding: 20px; }
        .header { text-align: center; margin-bottom: 40px; color: #2c3e50; }
        
        /* YouTube ಶೈಲಿಯ ಗ್ರಿಡ್[cite: 9] */
        .video-grid { display: grid; grid-template-columns: repeat(auto-fill, minmax(300px, 1fr)); gap: 20px; max-width: 1200px; margin: 0 auto; }
        .video-card { background: white; border-radius: 12px; overflow: hidden; box-shadow: 0 4px 10px rgba(0,0,0,0.05); cursor: pointer; transition: 0.3s; text-decoration: none; color: black; }
        .video-card:hover { transform: translateY(-5px); box-shadow: 0 8px 20px rgba(0,0,0,0.15); }
        
        .thumbnail { width: 100%; aspect-ratio: 16/9; object-fit: cover; }
        .video-info { padding: 15px; }
        .video-title { font-size: 16px; font-weight: 600; margin: 0; line-height: 1.4; display: -webkit-box; -webkit-line-clamp: 2; line-clamp: 2; -webkit-box-orient: vertical; overflow: hidden; }
        
        .back-btn { display: block; width: 200px; margin: 40px auto; padding: 10px; text-align: center; background: #e74c3c; color: white; text-decoration: none; border-radius: 5px; font-weight: bold; }
    </style>
</head>
<body>

    <h2 class="header" id="pageTitle">Loading Videos...</h2>

    <div class="video-grid" id="videoGrid">
        <!-- Videos will load here automatically -->
    </div>

    <a href="javascript:history.back()" class="back-btn">⬅ Back</a>

    <script>
        // 1. ಲಿಂಕ್‌ನಿಂದ ಕ್ಯಾಟಗರಿ ಹೆಸರು ತೆಗೆಯುವುದು (ಉದಾಹರಣೆಗೆ: ?category=paper1)
        const urlParams = new URLSearchParams(window.location.search);
        const category = urlParams.get('category');
        
        // ಟೈಟಲ್ ಬದಲಾಯಿಸುವುದು
        document.getElementById('pageTitle').innerText = category.toUpperCase() + " - Video Classes";

        // 2. ಡೇಟಾಬೇಸ್‌ನಿಂದ ವಿಡಿಯೋ ತರುವುದು
        async function fetchVideos() {
            const response = await fetch(`/api/videos?category=${category}`);
            const videos = await response.json();
            const grid = document.getElementById('videoGrid');

            if (videos.length === 0) {
                grid.innerHTML = "<p style='text-align:center; grid-column: 1/-1;'>ಈ ವಿಭಾಗದಲ್ಲಿ ಇನ್ನೂ ಯಾವುದೇ ವಿಡಿಯೋಗಳಿಲ್ಲ.</p>";
                return;
            }

            videos.forEach(video => {
                // ತಾನಾಗಿಯೇ YouTube ತಂಬ್‌ನೇಲ್ ಸೃಷ್ಟಿಸುವ ಲಿಂಕ್
                const thumbnailUrl = `https://img.youtube.com/vi/${video.videoId}/hqdefault.jpg`;
                const youtubeLink = `https://www.youtube.com/watch?v=${video.videoId}`;

                // ಕಾರ್ಡ್ ವಿನ್ಯಾಸ[cite: 9]
                const card = `
                    <a href="${youtubeLink}" target="_blank" class="video-card">
                        <img src="${thumbnailUrl}" class="thumbnail" alt="Thumbnail">
                        <div class="video-info">
                            <h3 class="video-title">${video.title}</h3>
                        </div>
                    </a>
                `;
                grid.innerHTML += card;
            });
        }

        fetchVideos();
    </script>
</body>
</html>
