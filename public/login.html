<!DOCTYPE html>
<html lang="kn">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Login - Chaithanya Career Academy</title>
    <style>
        body {
            -webkit-user-select: none;
            -ms-user-select: none;
            user-select: none;
            font-family: Arial, sans-serif;
            background-color: #f4f4f9;
            display: flex;
            justify-content: center;
            align-items: center;
            height: 100vh;
            margin: 0;
        }
        .form-box {
            background: white;
            padding: 30px;
            border-radius: 10px;
            width: 320px;
            box-shadow: 0 4px 10px rgba(0,0,0,0.1);
            text-align: center;
        }
        h2 { color: #007bff; margin-bottom: 5px; }
        p { color: #666; font-size: 14px; margin-bottom: 20px; }
        input {
            width: 100%;
            padding: 12px;
            margin: 10px 0;
            border: 1px solid #ccc;
            border-radius: 5px;
            font-size: 15px;
            box-sizing: border-box;
        }
        button {
            width: 100%;
            padding: 12px;
            background-color: #007bff;
            color: white;
            border: none;
            border-radius: 5px;
            cursor: pointer;
            font-size: 16px;
            font-weight: bold;
            margin-top: 10px;
        }
        button:hover { background-color: #0056b3; }
        .links { margin-top: 20px; font-size: 14px; }
        .links a { color: #007bff; text-decoration: none; cursor: pointer; }
        .links a:hover { text-decoration: underline; }
        
        /* ಮರೆಮಾಡಲು ಕ್ಲಾಸ್ (Hide Forms) */
        .hidden { display: none; }
    </style>
</head>
<body>

    <div class="form-box">
        
        <!-- 1. ಲಾಗಿನ್ ವಿಭಾಗ (Login Section) -->
        <div id="loginSection">
            <h2>ವಿದ್ಯಾರ್ಥಿ ಲಾಗಿನ್</h2>
            <p>ನಿಮ್ಮ ಖಾತೆಗೆ ಪ್ರವೇಶಿಸಿ (Login to your account)</p>
            
            <form action="/login" method="POST">
                <input type="email" name="email" placeholder="ನಿಮ್ಮ ಇಮೇಲ್ (Email)" required>
                <div style="position: relative; width: 100%; margin-bottom: 15px;">
                    <input type="password" id="password" name="password" placeholder="ಪಾಸ್‌ವರ್ಡ್ (Password)" required style="padding-right: 40px; margin-bottom: 0;">
                    <span id="togglePassword" style="position: absolute; right: 10px; top: 50%; transform: translateY(-50%); cursor: pointer; font-size: 18px;"></span>
                </div>
                <button type="submit">Login (ಲಾಗಿನ್)</button>
            </form>

            <div class="links">
                <p><a onclick="showForgotPassword()">Forgot Password? (ಪಾಸ್‌ವರ್ಡ್ ಮರೆತಿರಾ?)</a></p>
                <p>ಖಾತೆ ಇಲ್ಲವೇ? <a href="signup.html">ಹೊಸ ಖಾತೆ ಸೃಷ್ಟಿಸಿ (Sign Up)</a></p>
                <p><a href="index.html">🏠 ಮುಖಪುಟಕ್ಕೆ ಹಿಂತಿರುಗಿ</a></p>
            </div>
        </div>

        <!-- 2. ಪಾಸ್‌ವರ್ಡ್ ಮರೆತವರ ವಿಭಾಗ (Forgot Password Section) -->
        <div id="forgotPasswordSection" class="hidden">
            <h2>ಪಾಸ್‌ವರ್ಡ್ ಮರುಹೊಂದಿಸಿ</h2>
            <p id="forgotMessage">OTP ಪಡೆಯಲು ನಿಮ್ಮ ರಿಜಿಸ್ಟರ್ಡ್ ಇಮೇಲ್ ನಮೂದಿಸಿ</p>
            
            <!-- ಸ್ಟೆಪ್ A: ಇಮೇಲ್ ಹಾಕುವುದು -->
            <div id="emailStep">
                <input type="email" id="resetEmail" placeholder="ನಿಮ್ಮ ಇಮೇಲ್ (Email)" required>
                <button onclick="sendOTP()">Send OTP</button>
            </div>

            <!-- ಸ್ಟೆಪ್ B: OTP ಮತ್ತು ಹೊಸ ಪಾಸ್‌ವರ್ಡ್ ಹಾಕುವುದು (ಮೊದಲು ಮರೆಯಾಗಿರುತ್ತದೆ) -->
            <div id="otpStep" class="hidden">
                <input type="text" id="otpCode" placeholder="ನಿಮ್ಮ ಇಮೇಲ್‌ಗೆ ಬಂದ 6-ಅಂಕಿಯ OTP ಹಾಕಿ" required>
                <input type="password" id="newPassword" placeholder="ಹೊಸ ಪಾಸ್‌ವರ್ಡ್ (New Password)" required>
                <button onclick="verifyAndReset()">Reset Password</button>
            </div>

            <div class="links">
                <p><a onclick="showLogin()">⬅ Back to Login (ಲಾಗಿನ್‌ಗೆ ಹಿಂತಿರುಗಿ)</a></p>
            </div>
        </div>

    </div>

<script>
    /* ===============================
       1. Eye Icon Script (ಪಾಸ್‌ವರ್ಡ್ ನೋಡಲು)
       =============================== */
    const togglePassword = document.getElementById('togglePassword');
    const password = document.getElementById('password');
    const eyeOpen = `<svg width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="#555" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M1 12s4-8 11-8 11 8 11 8-4 8-11 8-11-8-11-8z"></path><circle cx="12" cy="12" r="3"></circle></svg>`;
    const eyeClosed = `<svg width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="#555" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M17.94 17.94A10.07 10.07 0 0 1 12 20c-7 0-11-8-11-8a18.45 18.45 0 0 1 5.06-5.94M9.9 4.24A9.12 9.12 0 0 1 12 4c7 0 11 8 11 8a18.5 18.5 0 0 1-2.16 3.19m-6.72-1.07a3 3 0 1 1-4.24-4.24"></path><line x1="1" y1="1" x2="23" y2="23"></line></svg>`;
    
    togglePassword.innerHTML = eyeOpen;
    togglePassword.addEventListener('click', function () {
        const type = password.getAttribute('type') === 'password' ? 'text' : 'password';
        password.setAttribute('type', type);
        this.innerHTML = type === 'password' ? eyeOpen : eyeClosed;
    });

    /* ===============================
       2. Security Script (Copy/Print ತಡೆಯಲು)
       =============================== */
    document.addEventListener('contextmenu', event => event.preventDefault());
    document.addEventListener('copy', event => event.preventDefault());
    document.onkeydown = function(e) {
        if (e.keyCode == 123) return false;
        if (e.ctrlKey && e.shiftKey && (e.keyCode == 'I'.charCodeAt(0) || e.keyCode == 'C'.charCodeAt(0) || e.keyCode == 'J'.charCodeAt(0))) return false;
        if (e.ctrlKey && e.keyCode == 'U'.charCodeAt(0)) return false;
        if (e.ctrlKey && e.keyCode == 'C'.charCodeAt(0)) return false;
        if (e.ctrlKey && e.keyCode == 'P'.charCodeAt(0)) return false;
    };

    /* ===============================
       3. Forgot Password Navigation Scripts
       =============================== */
    function showForgotPassword() {
        document.getElementById("loginSection").classList.add("hidden");
        document.getElementById("forgotPasswordSection").classList.remove("hidden");
    }

    function showLogin() {
        document.getElementById("forgotPasswordSection").classList.add("hidden");
        document.getElementById("loginSection").classList.remove("hidden");
        // ಎಲ್ಲ ಬಾಕ್ಸ್‌ಗಳನ್ನು ಮೊದಲಿನಂತೆ ಮಾಡಲು
        document.getElementById("emailStep").classList.remove("hidden");
        document.getElementById("otpStep").classList.add("hidden");
        document.getElementById("forgotMessage").innerText = "OTP ಪಡೆಯಲು ನಿಮ್ಮ ರಿಜಿಸ್ಟರ್ಡ್ ಇಮೇಲ್ ನಮೂದಿಸಿ";
    }

    // 3. Forgot Password API Connections
    let userResetEmail = ""; // ಇಮೇಲ್ ಅನ್ನು ತಾತ್ಕಾಲಿಕವಾಗಿ ಸ್ಟೋರ್ ಮಾಡಲು

    async function sendOTP() {
        const emailInput = document.getElementById("resetEmail").value;
        if(!emailInput) { alert("ದಯವಿಟ್ಟು ಇಮೇಲ್ ನಮೂದಿಸಿ!"); return; }
        
        userResetEmail = emailInput;

        try {
            const response = await fetch('/send-otp', {
                method: 'POST',
                headers: { 'Content-Type': 'application/json' },
                body: JSON.stringify({ email: userResetEmail })
            });
            const data = await response.json();

            if (data.success) {
                alert(data.message); // OTP ಕಳುಹಿಸಲಾಗಿದೆ ಸಂದೇಶ
                document.getElementById("emailStep").classList.add("hidden");
                document.getElementById("otpStep").classList.remove("hidden");
                document.getElementById("forgotMessage").innerText = "OTP ಮತ್ತು ಹೊಸ ಪಾಸ್‌ವರ್ಡ್ ನಮೂದಿಸಿ";
            } else {
                alert(data.message);
            }
        } catch (error) {
            alert("ಸರ್ವರ್ ಸಂಪರ್ಕಿಸುವಲ್ಲಿ ದೋಷ ಉಂಟಾಗಿದೆ.");
        }
    }

    async function verifyAndReset() {
        const otpInput = document.getElementById("otpCode").value;
        const newPassInput = document.getElementById("newPassword").value;
        
        if(!otpInput || !newPassInput) { alert("OTP ಮತ್ತು ಹೊಸ ಪಾಸ್‌ವರ್ಡ್ ಎರಡನ್ನೂ ನಮೂದಿಸಿ!"); return; }
        
        try {
            const response = await fetch('/reset-password', {
                method: 'POST',
                headers: { 'Content-Type': 'application/json' },
                body: JSON.stringify({ email: userResetEmail, otp: otpInput, newPassword: newPassInput })
            });
            const data = await response.json();

            if (data.success) {
                alert(data.message); // ಯಶಸ್ವಿಯಾಗಿ ಬದಲಾಗಿದೆ ಸಂದೇಶ
                showLogin();
            } else {
                alert(data.message); // OTP ತಪ್ಪು ಸಂದೇಶ
            }
        } catch (error) {
            alert("ಸರ್ವರ್ ಸಂಪರ್ಕಿಸುವಲ್ಲಿ ದೋಷ ಉಂಟಾಗಿದೆ.");
        }
    }

   // ಫಾರ್ಮ್ ಲೋಡ್ ಆದ ತಕ್ಷಣವೇ ಲಿಂಕ್ ಅನ್ನು ಸೆಟ್ ಮಾಡಲು
    document.addEventListener("DOMContentLoaded", function() {
        const urlParams = new URLSearchParams(window.location.search);
        const redirectPage = urlParams.get('redirect');
        
        if (redirectPage) {
            const loginForm = document.querySelector('form');
            if (loginForm) {
                loginForm.action = `/login?redirect=${redirectPage}`;
            }
        }
    });
    
</script>
</body>
</html>
