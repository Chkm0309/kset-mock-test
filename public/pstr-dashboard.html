<!DOCTYPE html>
<html lang="kn">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>PSTR Dashboard - Chaithanya Career Academy</title>
    <style>
        body {
    -webkit-user-select: none; /* Safari, Chrome */
    -ms-user-select: none; /* IE, Edge */
    user-select: none; /* Standard */
        }
        body { font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif; background-color: #e8f0fe; margin: 0; padding: 50px 20px; display: flex; flex-direction: column; align-items: center; }
        h2 { color: #2c3e50; font-size: 32px; font-weight: 900; margin-bottom: 40px; text-transform: uppercase; letter-spacing: 1px; text-align: center; }
        .box-container { display: flex; gap: 30px; justify-content: center; flex-wrap: wrap; margin-bottom: 40px; }
        
        .paper-box { background: white; border-radius: 16px; width: 300px; padding: 40px 20px; text-align: center; text-decoration: none; transition: 0.3s; box-shadow: 0 10px 20px rgba(0,0,0,0.05); }
        .paper-box:hover { transform: translateY(-5px); }
        
        /* Paper 1 Blue Design */
        .box-1 { border-bottom: 6px solid #0984e3; }
        .box-1:hover { box-shadow: 0 15px 30px rgba(9, 132, 227, 0.2); }
        .box-1 h3 { color: #0984e3; font-size: 28px; margin: 0 0 10px 0; }
        
        /* Paper 2 Red Design */
        .box-2 { border: 2px solid #e74c3c; box-shadow: 0 10px 20px rgba(231, 76, 60, 0.15); }
        .box-2:hover { box-shadow: 0 15px 30px rgba(231, 76, 60, 0.3); }
        .box-2 h3 { color: #e74c3c; font-size: 28px; margin: 0 0 10px 0; }

        p { color: #2d3436; font-weight: bold; font-size: 16px; margin: 0; }
        .btn-back { background: white; color: #0984e3; padding: 10px 25px; border-radius: 8px; text-decoration: none; font-weight: bold; box-shadow: 0 4px 6px rgba(0,0,0,0.05); transition: 0.3s; }
        .btn-back:hover { background: #0984e3; color: white; }
    </style>
</head>
<body>

    <h2>PSTR / GPSTR / HSTR</h2>

    <div class="box-container">
        <!-- Paper 1 Box -->
        <a href="paper-tests.html?subject=pstr-paper1" class="paper-box box-1">
            <h3>PAPER 1</h3>
            <p>GENERAL PAPER</p>
        </a>

        <!-- Paper 2 Box -->
        <a href="paper-tests.html?subject=pstr-paper2" class="paper-box box-2">
            <h3>PAPER 2</h3>
            <p>PHYSICS & MATHS</p>
        </a>
    </div>

    <a href="test-dashboard.html" class="btn-back">⬅ Back to Dashboard</a>

    <script>
    // 1. ರೈಟ್-ಕ್ಲಿಕ್ ತಡೆಯಲು
    document.addEventListener('contextmenu', event => event.preventDefault());

    // 2. ಮೌಸ್ ಮೂಲಕ Copy ಮಾಡುವುದನ್ನು ತಡೆಯಲು
    document.addEventListener('copy', event => {
        event.preventDefault();
    });

    // 3. ಕೀಬೋರ್ಡ್ ಶಾರ್ಟ್‌ಕಟ್‌ಗಳನ್ನು ತಡೆಯಲು
    document.onkeydown = function(e) {
        // F12 ತಡೆಯಲು
        if (e.keyCode == 123) return false;
        
        // Ctrl+Shift+I, Ctrl+Shift+C, Ctrl+Shift+J ತಡೆಯಲು
        if (e.ctrlKey && e.shiftKey && (e.keyCode == 'I'.charCodeAt(0) || e.keyCode == 'C'.charCodeAt(0) || e.keyCode == 'J'.charCodeAt(0))) {
            return false;
        }
        
        // Ctrl+U (View Source) ತಡೆಯಲು
        if (e.ctrlKey && e.keyCode == 'U'.charCodeAt(0)) return false;
        
        // Ctrl+C (Copy) ತಡೆಯಲು
        if (e.ctrlKey && e.keyCode == 'C'.charCodeAt(0)) return false;
        
        // Ctrl+P (Print) ತಡೆಯಲು
        if (e.ctrlKey && e.keyCode == 'P'.charCodeAt(0)) return false;
    };
</script>

</body>
</html>
