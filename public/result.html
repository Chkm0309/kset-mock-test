<!DOCTYPE html>
<html lang="kn">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Test Result - Chaithanya Career Academy</title>
    <style>
        body { font-family: Arial, sans-serif; background-color: #f4f7f6; margin: 0; padding: 20px; display: flex; flex-direction: column; align-items: center; min-height: 100vh; }
        .result-card { background: white; width: 100%; max-width: 700px; padding: 30px; border-radius: 12px; box-shadow: 0 8px 16px rgba(0,0,0,0.1); text-align: center; border-top: 5px solid #28a745; margin-bottom: 30px; }
        h2 { color: #333; margin-bottom: 5px; }
        .test-name { color: #666; font-size: 16px; margin-bottom: 30px; }
        
        .score-section { display: flex; justify-content: center; align-items: center; flex-direction: column; }
        .score-circle { width: 140px; height: 140px; border-radius: 50%; border: 12px solid #28a745; display: flex; justify-content: center; align-items: center; font-size: 32px; font-weight: bold; color: #28a745; margin-bottom: 10px; }
        
        .stats-grid { display: flex; justify-content: space-between; margin-top: 40px; gap: 15px; }
        .stat-box { background: #f8f9fa; padding: 20px; border-radius: 10px; flex: 1; border: 1px solid #e9ecef; }
        .stat-box h4 { margin: 0 0 10px 0; color: #555; font-size: 15px; }
        .stat-box p { margin: 0; font-size: 20px; font-weight: bold; color: #007bff; }
        
        .btn-back { display: inline-block; margin-top: 30px; padding: 12px 25px; background: #6c757d; color: white; text-decoration: none; border-radius: 5px; font-weight: bold; border: none; cursor: pointer; }
        .btn-view-sols { background: #17a2b8; margin-left: 10px; }
        
        /* ವಿವರಣಾತ್ಮಕ ಉತ್ತರಗಳ ವಿನ್ಯಾಸ (Soft Colors) */
        #solutions-container { width: 100%; max-width: 800px; display: none; }
        .sol-box { margin-bottom: 25px; padding: 20px; border: 1px solid #ddd; border-radius: 8px; background: #fff; box-shadow: 0 2px 5px rgba(0,0,0,0.05); }
        .sol-option { padding: 12px; margin: 8px 0; border-radius: 5px; border: 1px solid #eee; background: #f9f9f9; }
        .sol-correct { background-color: #d4edda; border-color: #c3e6cb; color: #155724; font-weight: bold; } /* ತಿಳಿ ಹಸಿರು */
        .sol-wrong { background-color: #f8d7da; border-color: #f5c6cb; color: #721c24; font-weight: bold; } /* ತಿಳಿ ಕೆಂಪು */
        .sol-explanation { margin-top: 15px; padding: 15px; background-color: #eef2f5; border-left: 5px solid #007bff; font-size: 15px; border-radius: 4px; line-height: 1.6; }
    </style>
</head>
<body>

    <!-- ಸ್ಕೋರ್‌ಕಾರ್ಡ್ -->
    <div class="result-card">
        <h2>📊 ನಿಮ್ಮ ಪರೀಕ್ಷೆಯ ಫಲಿತಾಂಶ (Result)</h2>
        <div class="test-name" id="test-title">Loading...</div>

        <div class="score-section">
            <p style="margin:0; font-weight:bold; color:#555;">ಪಡೆದ ಅಂಕಗಳು (Score)</p>
            <div class="score-circle" id="score-display">--/--</div>
        </div>

        <div class="stats-grid">
            <div class="stat-box">
                <h4>🎯 ನಿಖರತೆ (Accuracy)</h4>
                <p id="accuracy-display">--%</p>
            </div>
            <div class="stat-box">
                <h4>⏱️ ತೆಗೆದುಕೊಂಡ ಸಮಯ</h4>
                <p id="time-display">--:--</p>
            </div>
            <div class="stat-box">
                <h4>📅 ಬರೆದ ದಿನಾಂಕ</h4>
                <p id="date-display">--/--/----</p>
            </div>
        </div>

        <div style="margin-top: 20px;">
            <a href="paper1-tests.html" class="btn-back">⬅ Dashboard</a>
            <button class="btn-back btn-view-sols" onclick="renderSolutions()">View Solutions 👁️</button>
        </div>
    </div>

    <!-- ವಿವರಣಾತ್ಮಕ ಉತ್ತರಗಳ ವಿಭಾಗ -->
    <div id="solutions-container">
        <h2 style="text-align: center; color: #333;">ಸರಿಯಾದ ಉತ್ತರಗಳು ಮತ್ತು ವಿವರಣೆ</h2>
        <hr style="margin-bottom: 20px;">
        <div id="sols-list"></div>
    </div>

    <script>
        let globalUserAnswers = [];
        // ನಿಮ್ಮ mocktest.html ನಲ್ಲಿದ್ದ ಪ್ರಶ್ನೆಗಳು ಇಲ್ಲಿರಬೇಕು
        const questions = [
            { q: "ಬ್ಲೂಮ್ಸ್ ಟ್ಯಾಕ್ಸಾನಮಿಯ (Bloom's Taxonomy) ಪ್ರಕಾರ ಅತ್ಯುನ್ನತ ಅರಿವಿನ ಹಂತ (Highest cognitive level) ಯಾವುದು?", options: ["A) ತಿಳಿಯುವುದು (Knowing)", "B) ಅರ್ಥಮಾಡಿಕೊಳ್ಳುವುದು (Understanding)", "C) ವಿಶ್ಲೇಷಿಸುವುದು (Analyzing)", "D) ಮೌಲ್ಯಮಾಪನ ಮಾಡುವುದು (Evaluating)"], ans: 3, explanation: "ಬ್ಲೂಮ್ಸ್ ಟ್ಯಾಕ್ಸಾನಮಿಯ (1956) ಮೂಲ ಆವೃತ್ತಿಯ ಪ್ರಕಾರ, ಕಲಿಕೆಯ ಅತ್ಯುನ್ನತ ಹಂತ 'ಮೌಲ್ಯಮಾಪನ ಮಾಡುವುದು' (Evaluating) ಆಗಿದೆ." },
            { q: "ಕ್ರಿಯಾ ಸಂಶೋಧನೆ (Action Research) ಎಂದರೆ ಏನು?", options: ["A) ಹೊಸ ಸಿದ್ಧಾಂತವನ್ನು ರಚಿಸುವುದು", "B) ತಕ್ಷಣದ ಸಮಸ್ಯೆಯನ್ನು ಪರಿಹರಿಸಲು ಮಾಡುವ ಸಂಶೋಧನೆ", "C) ಐತಿಹಾಸಿಕ ಘಟನೆಗಳ ಅಧ್ಯಯನ", "D) ಲ್ಯಾಬ್‌ನಲ್ಲಿ ಮಾಡುವ ಪ್ರಯೋಗ"], ans: 1, explanation: "ಕ್ರಿಯಾ ಸಂಶೋಧನೆಯ ಮುಖ್ಯ ಉದ್ದೇಶವು ಸ್ಥಳೀಯ ಅಥವಾ ತಕ್ಷಣದ (Immediate) ಸಮಸ್ಯೆಗಳನ್ನು ಬಗೆಹರಿಸುವುದಾಗಿದೆ." },
            { q: "ಮಾಹಿತಿ ತಂತ್ರಜ್ಞಾನದಲ್ಲಿ (ICT), 1 ಗಿಗಾಬೈಟ್ (GB) ಎಂದರೆ ಎಷ್ಟು?", options: ["A) 1024 Bytes", "B) 1024 KB", "C) 1024 MB", "D) 1024 TB"], ans: 2, explanation: "ಕಂಪ್ಯೂಟರ್ ಮೆಮೊರಿ ಅಳತೆಯಲ್ಲಿ: 1 KB = 1024 Bytes, 1 MB = 1024 KB, ಮತ್ತು 1 GB = 1024 MB (ಮೆಗಾಬೈಟ್) ಆಗಿರುತ್ತದೆ." },
            { q: "ಸುಸ್ಥಿರ ಅಭಿವೃದ್ಧಿ ಗುರಿಗಳನ್ನು (Sustainable Development Goals - SDGs) ಯಾವ ವರ್ಷದೊಳಗೆ ಸಾಧಿಸಲು ವಿಶ್ವಸಂಸ್ಥೆ ಗುರಿ ನಿಗದಿಪಡಿಸಿದೆ?", options: ["A) 2025", "B) 2030", "C) 2035", "D) 2050"], ans: 1, explanation: "ವಿಶ್ವಸಂಸ್ಥೆಯು (UN) 2015 ರಲ್ಲಿ 17 ಸುಸ್ಥಿರ ಅಭಿವೃದ್ಧಿ ಗುರಿಗಳನ್ನು (SDGs) ಜಾರಿಗೆ ತಂದಿದ್ದು, ಇವುಗಳನ್ನು 2030 ರ ವೇಳೆಗೆ ಸಾಧಿಸುವ ಗುರಿಯನ್ನು ಹೊಂದಲಾಗಿದೆ." },
            { q: "ಸಂವಹನ (Communication) ಪ್ರಕ್ರಿಯೆಯಲ್ಲಿ ಮಾಹಿತಿಯನ್ನು ಸ್ವೀಕರಿಸುವವನು (Receiver) ಸಂದೇಶವನ್ನು ಅರ್ಥೈಸಿಕೊಳ್ಳುವ ಹಂತವನ್ನು ಏನೆಂದು ಕರೆಯುತ್ತಾರೆ?", options: ["A) ಎನ್‌ಕೋಡಿಂಗ್ (Encoding)", "B) ಡಿಕೋಡಿಂಗ್ (Decoding)", "C) ಫೀಡ್‌ಬ್ಯಾಕ್ (Feedback)", "D) ಚಾನೆಲ್ (Channel)"], ans: 1, explanation: "ಸಂದೇಶವನ್ನು ಕಳುಹಿಸುವವನು ಅದನ್ನು 'ಎನ್‌ಕೋಡ್' (ರೂಪಿಸುವುದು) ಮಾಡುತ್ತಾನೆ. ಸ್ವೀಕರಿಸುವ ವ್ಯಕ್ತಿಯು ಅದನ್ನು ಓದಿ ಅರ್ಥಮಾಡಿಕೊಳ್ಳುವ ಪ್ರಕ್ರಿಯೆಗೆ 'ಡಿಕೋಡಿಂಗ್' (Decoding) ಎನ್ನುತ್ತಾರೆ." }
        ];

        async function fetchMyResult() {
            try {
                const response = await fetch('/get-my-results', { cache: 'no-store' });
                if (response.status === 401) {
                    window.location.href = "login.html"; return;
                }
                const results = await response.json();
                // ಆ ಪರೀಕ್ಷೆಯ ಎಲ್ಲಾ ಅಟೆಂಪ್ಟ್‌ಗಳನ್ನು ಫಿಲ್ಟರ್ ಮಾಡುವುದು
const allAttempts = results.filter(r => r.testName === "PYUT 1: Business Environment");
// ಕೊನೆಯ ಬಾರಿಗೆ (Latest) ಬರೆದ ಪರೀಕ್ಷೆಯ ಫಲಿತಾಂಶವನ್ನು ಮಾತ್ರ ತೆಗೆದುಕೊಳ್ಳುವುದು
const myResult = allAttempts[allAttempts.length - 1];

                if (myResult) {
                    document.getElementById('test-title').innerText = myResult.testName;
                    document.getElementById('score-display').innerText = myResult.score + " / " + myResult.maxMarks;
                    let accuracy = ((myResult.score / myResult.maxMarks) * 100).toFixed(2);
                    document.getElementById('accuracy-display').innerText = accuracy + "%";
                    document.getElementById('time-display').innerText = myResult.timeTaken;
                    document.getElementById('date-display').innerText = myResult.attemptDate;
                    
                    // ವಿದ್ಯಾರ್ಥಿಯ ಉತ್ತರಗಳನ್ನು ಸೇವ್ ಮಾಡಿಕೊಳ್ಳುವುದು
                    globalUserAnswers = myResult.userAnswers || [];
                }
            } catch (error) {
                console.error("Error fetching results:", error);
            }
        }

        function renderSolutions() {
            if(globalUserAnswers.length === 0) {
                alert("ಈ ಹಳೆಯ ಫಲಿತಾಂಶದಲ್ಲಿ ಉತ್ತರಗಳು ಸೇವ್ ಆಗಿಲ್ಲ. ದಯವಿಟ್ಟು ಪರೀಕ್ಷೆಯನ್ನು ಮತ್ತೊಮ್ಮೆ ಬರೆಯಿರಿ (Re-attempt).");
                return;
            }

            document.getElementById('solutions-container').style.display = 'block';
            let container = document.getElementById('sols-list');
            container.innerHTML = '';

            for (let i = 0; i < questions.length; i++) {
                let qData = questions[i];
                let userAns = globalUserAnswers[i];
                let correctAns = qData.ans;
                let html = `<div class="sol-box"><p style="font-size:18px; margin-bottom:15px;"><b>Q${i + 1}.</b> ${qData.q}</p>`;

                for (let j = 0; j < qData.options.length; j++) {
                    let optClass = "sol-option";
                    let icon = "";
                    if (j === correctAns) {
                        optClass += " sol-correct"; icon = " ✔️ (ಸರಿಯಾದ ಉತ್ತರ)";
                    } else if (j === userAns && userAns !== correctAns) {
                        optClass += " sol-wrong"; icon = " ❌ (ನಿಮ್ಮ ಉತ್ತರ)";
                    }
                    html += `<div class="${optClass}">${qData.options[j]} ${icon}</div>`;
                }

                let statusText = "";
                if (userAns === null) statusText = "<b style='color:#ff8c00'>ನೀವು ಈ ಪ್ರಶ್ನೆಗೆ ಉತ್ತರಿಸಿಲ್ಲ.</b>";
                else if (userAns === correctAns) statusText = "<b style='color:#28a745'>ನಿಮ್ಮ ಉತ್ತರ ಸರಿಯಾಗಿದೆ! (+2 ಅಂಕ)</b>";
                else statusText = "<b style='color:#dc3545'>ನಿಮ್ಮ ಉತ್ತರ ತಪ್ಪಾಗಿದೆ!</b>";

                html += `<div class="sol-explanation"><p>${statusText}</p><b>ವಿವರಣೆ:</b> ${qData.explanation}</div></div>`;
                container.innerHTML += html;
            }
            // ಸ್ಕ್ರೀನ್ ಅನ್ನು ಕೆಳಗೆ ಸ್ಕ್ರಾಲ್ ಮಾಡುವುದು
            document.getElementById('solutions-container').scrollIntoView({ behavior: 'smooth' });
        }

        window.onload = fetchMyResult;
    </script>
</body>
</html>
