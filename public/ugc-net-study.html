<!DOCTYPE html>
<html lang="kn">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>UGC NET / KSET - Study Materials</title>
    
    <!-- ಲಾಗಿನ್ ಚೆಕ್ ಆಗುವವರೆಗೆ ಪೇಜ್ ಮುಚ್ಚಿಡಲು -->
    <meta http-equiv="Cache-Control" content="no-store, no-cache, must-revalidate, max-age=0">
    <meta http-equiv="Pragma" content="no-cache">
    <style> body { display: none; } </style>

    <style>
        body {
            -webkit-user-select: none; -ms-user-select: none; user-select: none;
            font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
            background: linear-gradient(135deg, #f5f7fa 0%, #c3cfe2 100%);
            margin: 0; 
            padding: 60px 20px;
            /* JavaScript ನಿಂದ ಇದು flex ಆಗಿ ಬದಲಾಗುತ್ತದೆ */
            flex-direction: column; 
            align-items: center; 
            min-height: 100vh;
            box-sizing: border-box;
        }

        .header-title { 
            color: #2c3e50; 
            font-size: 38px; 
            font-weight: 900;
            margin-bottom: 8px; 
            text-align: center; 
            text-transform: uppercase;
        }
        
        .sub-title { 
            color: #7f8c8d; 
            font-size: 16px; 
            font-weight: bold;
            letter-spacing: 2px;
            margin-bottom: 60px; 
            text-align: center; 
        }

        /* ಗ್ರಿಡ್ (ಬಾಕ್ಸ್‌ಗಳನ್ನು ಜೋಡಿಸಲು ಮತ್ತು Responsive ಮಾಡಲು) */
        .grid-container {
            display: flex; 
            gap: 40px; 
            justify-content: center; 
            flex-wrap: wrap; 
            max-width: 900px; 
            width: 100%;
        }

        /* ಸ್ಟಡಿ ಮೆಟೀರಿಯಲ್ ಬಾಕ್ಸ್ ವಿನ್ಯಾಸ */
        .study-box {
            flex: 1; 
            min-width: 280px; 
            max-width: 400px;
            padding: 50px 30px;
            border-radius: 20px;
            text-align: center; 
            text-decoration: none; 
            color: white;
            transition: all 0.4s cubic-bezier(0.175, 0.885, 0.32, 1.275);
            position: relative;
            overflow: hidden;
        }

        .study-box:hover {
            transform: translateY(-10px);
        }

        /* Paper 1: ಬ್ಲೂ ಮತ್ತು ಸಯಾನ್ ಗ್ರೇಡಿಯಂಟ್ */
        .box-paper1 { 
            background: linear-gradient(135deg, #00c6ff 0%, #0072ff 100%);
            box-shadow: 0 15px 35px rgba(0, 114, 255, 0.3);
        } 
        
        /* Paper 2: ಪರ್ಪಲ್ ಮತ್ತು ಪಿಂಕ್ ಗ್ರೇಡಿಯಂಟ್ */
        .box-paper2 { 
            background: linear-gradient(135deg, #8E2DE2 0%, #4A00E0 100%);
            box-shadow: 0 15px 35px rgba(142, 45, 226, 0.3);
        }

        .icon {
            font-size: 45px;
            margin-bottom: 15px;
            display: block;
        }

        .study-box h3 { 
            font-size: 28px; 
            margin: 0 0 10px 0; 
            text-shadow: 1px 1px 3px rgba(0,0,0,0.2); 
        }
        
        .study-box p { 
            font-size: 18px; 
            margin: 0; 
            opacity: 0.95; 
            font-weight: 600;
        }

        .click-text { 
            display: inline-block; 
            margin-top: 25px; 
            font-size: 14px; 
            font-weight: bold; 
            background: rgba(255, 255, 255, 0.2);
            padding: 8px 20px;
            border-radius: 25px;
            transition: background 0.3s;
        }

        .study-box:hover .click-text {
            background: rgba(255, 255, 255, 0.35);
        }

        /* ವಾಪಸ್ ಹೋಗುವ ಬಟನ್ */
        .btn-back {
            margin-top: 60px; 
            display: inline-block; 
            padding: 12px 30px; 
            background: #ffffff; 
            color: #2c3e50; 
            text-decoration: none;
            font-weight: bold; 
            border-radius: 30px; 
            box-shadow: 0 5px 15px rgba(0,0,0,0.08);
            transition: 0.3s;
        }
        .btn-back:hover { 
            background: #f1f2f6; 
            transform: scale(1.05);
            color: #e74c3c;
        }

    </style>
</head>
<body>

    <h2 class="header-title">UGC NET / KSET</h2>
    <p class="sub-title">STUDY MATERIALS & NOTES</p>

    <div class="grid-container">
        <!-- Paper 1 Box -->
        <a href="ugc-net-options.html?paper=paper1" class="study-box box-paper1">
            <span class="icon">🌍</span>
            <h3>PAPER 1</h3>
            <p>GENERAL STUDIES</p>
            <span class="click-text">Click to View ⬇</span>
        </a>

        <!-- Paper 2 Box -->
        <a href="ugc-net-options.html?paper=paper2" class="study-box box-paper2">
            <span class="icon">📊</span>
            <h3>PAPER 2</h3>
            <p>COMMERCE</p>
            <span class="click-text">Click to View ⬇</span>
        </a>
    </div>
    
    <!-- ವಾಪಸ್ ಹೋಗಲು ಬಟನ್ -->
    <a href="study.html" class="btn-back">⬅ Back to Study Materials</a>

    <script>
        // 1. ಲಾಗಿನ್ ಚೆಕ್ 
        async function enforceLogin() {
            try {
                const response = await fetch('/check-login', { cache: "no-store" });
                const data = await response.json();
                
                if (!data.loggedIn) {
                    alert("ಈ ಪುಟವನ್ನು ನೋಡಲು ದಯವಿಟ್ಟು ಲಾಗಿನ್ ಮಾಡಿ!");
                    window.location.replace("login.html?redirect=/ugc-net-study.html"); 
                } else {
                    document.body.style.display = "flex";
                }
            } catch (error) {
                window.location.replace("login.html?redirect=/ugc-net-study.html");
            }
        }
        enforceLogin();

        window.addEventListener("pageshow", function (event) {
            if (event.persisted) window.location.reload();
        });

        // 2. ಭದ್ರತಾ ಸ್ಕ್ರಿಪ್ಟ್
        document.addEventListener('contextmenu', event => event.preventDefault());
        document.addEventListener('copy', event => event.preventDefault());
        document.onkeydown = function(e) {
            if (e.keyCode == 123) return false;
            if (e.ctrlKey && e.shiftKey && (e.keyCode == 'I'.charCodeAt(0) || e.keyCode == 'C'.charCodeAt(0) || e.keyCode == 'J'.charCodeAt(0))) return false;
            if (e.ctrlKey && e.keyCode == 'U'.charCodeAt(0)) return false;
            if (e.ctrlKey && e.keyCode == 'C'.charCodeAt(0)) return false;
            if (e.ctrlKey && e.keyCode == 'P'.charCodeAt(0)) return false;
        };
    </script>

</body>
</html>
