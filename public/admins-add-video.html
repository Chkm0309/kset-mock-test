<!DOCTYPE html>
<html lang="kn">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Admin - Manage Videos</title>
    <style>
        body { font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif; background: #2c3e50; display: flex; justify-content: center; padding: 40px 20px; margin: 0; min-height: 100vh; box-sizing: border-box;}
        .admin-card { background: white; padding: 30px; border-radius: 15px; box-shadow: 0 10px 30px rgba(0,0,0,0.2); width: 100%; max-width: 500px; height: fit-content; }
        h2, h3 { text-align: center; color: #34495e; margin-top: 0; }
        .form-group { margin-bottom: 20px; }
        label { display: block; margin-bottom: 8px; font-weight: bold; color: #555; }
        input, select { width: 100%; padding: 12px; border: 1px solid #ccc; border-radius: 6px; box-sizing: border-box; font-size: 15px; }
        button.btn-save { width: 100%; padding: 14px; background: #27ae60; color: white; border: none; border-radius: 6px; font-size: 16px; font-weight: bold; cursor: pointer; transition: 0.3s; }
        button.btn-save:hover { background: #219a52; }
        #message { text-align: center; margin-top: 15px; font-weight: bold; }
        
        /* ಡಿಲೀಟ್ ವಿಭಾಗದ ವಿನ್ಯಾಸ */
        .video-item { display: flex; justify-content: space-between; align-items: center; background: #f8f9fa; padding: 12px; margin-bottom: 10px; border-radius: 8px; border: 1px solid #e9ecef; }
        .video-item strong { color: #2c3e50; display: block; font-size: 15px; margin-bottom: 4px;}
        .video-item small { color: #7f8c8d; font-weight: bold; text-transform: uppercase; font-size: 11px;}
        button.btn-delete { background: #e74c3c; color: white; border: none; padding: 8px 12px; border-radius: 5px; cursor: pointer; font-weight: bold; transition: 0.2s;}
        button.btn-delete:hover { background: #c0392b; }
        .video-list-container { max-height: 350px; overflow-y: auto; margin-top: 15px; padding-right: 5px;}
    </style>
</head>
<body>

    <div class="admin-card">
        <h2>🎥 Upload New Video</h2>
        <form id="addVideoForm">
            <div class="form-group">
                <label>Video Title (ಶೀರ್ಷಿಕೆ)</label>
                <input type="text" id="title" required placeholder="Ex: KSET Paper 1 General Studies">
            </div>
            
            <div class="form-group">
                <label>Category (ವಿಭಾಗ)</label>
                <select id="category" required>
                    <option value="paper1">Paper 1 (General Studies)</option>
                    <option value="paper2">Paper 2 (Commerce)</option>
                    <option value="fda">FDA / SDA</option>
                    <option value="pstr">PSTR / GPSTR</option>
                </select>
            </div>

            <div class="form-group">
                <label>YouTube Link (URL)</label>
                <input type="url" id="url" required placeholder="https://www.youtube.com/watch?v=...">
            </div>

            <button type="submit" class="btn-save">Save Video</button>
            <div id="message"></div>
        </form>

        <hr style="margin: 30px 0; border: 0; border-top: 2px dashed #ddd;">
        
        <h3>🗑️ Manage Uploaded Videos</h3>
        <div id="videoList" class="video-list-container">
            <!-- ವಿಡಿಯೋಗಳ ಲಿಸ್ಟ್ ಇಲ್ಲಿ ಬರುತ್ತದೆ -->
        </div>
    </div>

    <script>
        // 1. ವಿಡಿಯೋಗಳನ್ನು ಸರ್ವರ್‌ನಿಂದ ತಂದು ತೋರಿಸುವ ಫಂಕ್ಷನ್
        async function loadVideos() {
            const listDiv = document.getElementById('videoList');
            listDiv.innerHTML = "<p style='text-align:center;'>Loading...</p>";
            try {
                const response = await fetch('/api/all-videos');
                const result = await response.json();
                
                if (result.success && result.videos.length > 0) {
                    listDiv.innerHTML = result.videos.map(v => `
                        <div class="video-item">
                            <div>
                                <strong>${v.title}</strong>
                                <small>${v.category}</small>
                            </div>
                            <button class="btn-delete" onclick="deleteVideo('${v._id}')">Delete</button>
                        </div>
                    `).join('');
                } else {
                    listDiv.innerHTML = "<p style='text-align:center; color:#777;'>ಯಾವುದೇ ವಿಡಿಯೋಗಳು ಅಪ್‌ಲೋಡ್ ಆಗಿಲ್ಲ.</p>";
                }
            } catch (error) {
                listDiv.innerHTML = "<p style='color:red; text-align:center;'>ವೀಡಿಯೊಗಳನ್ನು ಲೋಡ್ ಮಾಡಲು ಸಾಧ್ಯವಾಗಲಿಲ್ಲ.</p>";
            }
        }

        // 2. ವಿಡಿಯೋ ಡಿಲೀಟ್ ಮಾಡುವ ಫಂಕ್ಷನ್
        async function deleteVideo(id) {
            if (!confirm("ಖಂಡಿತವಾಗಿಯೂ ಈ ವಿಡಿಯೋವನ್ನು ಡಿಲೀಟ್ ಮಾಡಲು ಬಯಸುವಿರಾ?")) return;
            
            try {
                const response = await fetch(`/api/delete-video/${id}`, { method: 'DELETE' });
                const result = await response.json();
                
                if (result.success) {
                    alert(result.message);
                    loadVideos(); // ಡಿಲೀಟ್ ಆದ ತಕ್ಷಣ ಲಿಸ್ಟ್ ರಿಫ್ರೆಶ್ ಮಾಡಲು
                } else {
                    alert("Error: " + result.message);
                }
            } catch(error) {
                alert("Server Error while deleting!");
            }
        }

        // ಪೇಜ್ ಲೋಡ್ ಆದ ತಕ್ಷಣ ವಿಡಿಯೋ ಲಿಸ್ಟ್ ತರಿಸುವುದು
        loadVideos();

        // 3. ಹೊಸ ವಿಡಿಯೋ ಸೇವ್ ಮಾಡುವ ಕೋಡ್
        document.getElementById('addVideoForm').addEventListener('submit', async (e) => {
            e.preventDefault();
            const messageDiv = document.getElementById('message');
            messageDiv.style.color = 'black';
            messageDiv.innerText = "Saving...";

            const data = {
                title: document.getElementById('title').value,
                category: document.getElementById('category').value,
                url: document.getElementById('url').value
            };

            try {
                const response = await fetch('/api/add-video', {
                    method: 'POST',
                    headers: { 'Content-Type': 'application/json' },
                    body: JSON.stringify(data)
                });
                
                if (!response.ok) {
                    messageDiv.style.color = 'red';
                    messageDiv.innerText = "❌ Server Error: " + response.status;
                    return;
                }

                const result = await response.json();
                if(result.success) {
                    messageDiv.style.color = 'green';
                    messageDiv.innerText = "✅ Video Added Successfully!";
                    document.getElementById('addVideoForm').reset();
                    loadVideos(); // ಹೊಸ ವಿಡಿಯೋ ಸೇವ್ ಆದ ತಕ್ಷಣ ಕೆಳಗಿನ ಲಿಸ್ಟ್ ಕೂಡ ಅಪ್‌ಡೇಟ್ ಆಗಲು
                } else {
                    messageDiv.style.color = 'red';
                    messageDiv.innerText = "❌ " + result.message;
                }
            } catch (error) {
                messageDiv.style.color = 'red';
                messageDiv.innerText = "❌ Error connecting to server";
            }
        });
    </script>

</body>
</html>
