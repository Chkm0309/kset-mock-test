<!DOCTYPE html>
<html lang="kn">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Sign Up - Chaithanya Career Academy</title>
    <style>
        body {
            -webkit-user-select: none;
            -ms-user-select: none;
            user-select: none;
            font-family: Arial, sans-serif;
            background-color: #f4f4f9;
            display: flex;
            justify-content: center;
            align-items: center;
            height: 100vh;
            margin: 0;
        }
        .form-box { background: white; padding: 30px; border-radius: 10px; width: 320px; box-shadow: 0 4px 10px rgba(0,0,0,0.1); text-align: center; }
        h2 { color: #007bff; margin-bottom: 5px; }
        p { color: #666; font-size: 14px; margin-bottom: 20px; }
        input { width: 100%; padding: 12px; margin: 10px 0; border: 1px solid #ccc; border-radius: 5px; font-size: 15px; box-sizing: border-box; }
        button { width: 100%; padding: 12px; background-color: #28a745; color: white; border: none; border-radius: 5px; cursor: pointer; font-size: 16px; font-weight: bold; margin-top: 10px; }
        button:hover { background-color: #218838; }
        .links { margin-top: 20px; font-size: 14px; }
        .links a { color: #007bff; text-decoration: none; cursor: pointer;}
        .links a:hover { text-decoration: underline; }
        
        /* ಮರೆಮಾಡಲು ಕ್ಲಾಸ್ */
        .hidden { display: none; }
    </style>
</head>
<body>

    <div class="form-box">
        <h2>ಹೊಸ ಖಾತೆ ಸೃಷ್ಟಿಸಿ</h2>
        <p id="formMessage">ವಿದ್ಯಾರ್ಥಿ ನೋಂದಣಿ (Student Registration)</p>
        
        <!-- ಹಂತ 1: ವಿವರಗಳನ್ನು ನಮೂದಿಸುವುದು -->
        <div id="step1">
            <input type="text" id="regName" placeholder="ನಿಮ್ಮ ಹೆಸರು (Name)" required>
            <input type="email" id="regEmail" placeholder="ಇಮೇಲ್ (Email ID)" required>
            <div style="position: relative; width: 100%; margin-bottom: 15px;">
                <input type="password" id="regPassword" placeholder="ಹೊಸ ಪಾಸ್‌ವರ್ಡ್ (Create Password)" required style="padding-right: 40px; margin-bottom: 0;">
                <span id="togglePassword" style="position: absolute; right: 10px; top: 50%; transform: translateY(-50%); cursor: pointer; font-size: 18px;"></span>
            </div>
            <button onclick="sendSignupOTP()" id="btnSendOtp">Send OTP (OTP ಪಡೆಯಿರಿ)</button>
        </div>

        <!-- ಹಂತ 2: OTP ಪರಿಶೀಲನೆ -->
        <div id="step2" class="hidden">
            <input type="text" id="signupOtp" placeholder="ಇಮೇಲ್‌ಗೆ ಬಂದ 6-ಅಂಕಿಯ OTP ಹಾಕಿ" required>
            <button onclick="verifyAndRegister()" id="btnRegister">Verify & Register (ಖಾತೆ ಸೃಷ್ಟಿಸಿ)</button>
            <p style="margin-top: 15px;"><a onclick="backToStep1()">⬅ ವಿವರಗಳನ್ನು ಬದಲಾಯಿಸಿ</a></p>
        </div>

        <div class="links">
            <p>ಈಗಾಗಲೇ ಖಾತೆ ಇದೆಯೇ? <a href="login.html">ಇಲ್ಲಿ ಲಾಗಿನ್ ಮಾಡಿ (Login)</a></p>
            <p><a href="index.html">🏠 ಮುಖಪುಟಕ್ಕೆ ಹಿಂತಿರುಗಿ</a></p>
        </div>
    </div>

<script>
    /* ===============================
       1. Eye Icon Script (ಪಾಸ್‌ವರ್ಡ್ ನೋಡಲು)
       =============================== */
    const togglePassword = document.getElementById('togglePassword');
    const password = document.getElementById('regPassword');
    const eyeOpen = `<svg width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="#555" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M1 12s4-8 11-8 11 8 11 8-4 8-11 8-11-8-11-8z"></path><circle cx="12" cy="12" r="3"></circle></svg>`;
    const eyeClosed = `<svg width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="#555" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M17.94 17.94A10.07 10.07 0 0 1 12 20c-7 0-11-8-11-8a18.45 18.45 0 0 1 5.06-5.94M9.9 4.24A9.12 9.12 0 0 1 12 4c7 0 11 8 11 8a18.5 18.5 0 0 1-2.16 3.19m-6.72-1.07a3 3 0 1 1-4.24-4.24"></path><line x1="1" y1="1" x2="23" y2="23"></line></svg>`;
    
    togglePassword.innerHTML = eyeOpen;
    togglePassword.addEventListener('click', function () {
        const type = password.getAttribute('type') === 'password' ? 'text' : 'password';
        password.setAttribute('type', type);
        this.innerHTML = type === 'password' ? eyeOpen : eyeClosed;
    });

    /* ===============================
       2. Security Script 
       =============================== */
    document.addEventListener('contextmenu', event => event.preventDefault());
    document.addEventListener('copy', event => event.preventDefault());
    document.onkeydown = function(e) {
        if (e.keyCode == 123) return false;
        if (e.ctrlKey && e.shiftKey && (e.keyCode == 'I'.charCodeAt(0) || e.keyCode == 'C'.charCodeAt(0) || e.keyCode == 'J'.charCodeAt(0))) return false;
        if (e.ctrlKey && e.keyCode == 'U'.charCodeAt(0)) return false;
        if (e.ctrlKey && e.keyCode == 'C'.charCodeAt(0)) return false;
        if (e.ctrlKey && e.keyCode == 'P'.charCodeAt(0)) return false;
    };

    /* ===============================
       3. OTP & Registration Scripts
       =============================== */
    function backToStep1() {
        document.getElementById("step2").classList.add("hidden");
        document.getElementById("step1").classList.remove("hidden");
        document.getElementById("formMessage").innerText = "ವಿದ್ಯಾರ್ಥಿ ನೋಂದಣಿ (Student Registration)";
    }

    async function sendSignupOTP() {
        const name = document.getElementById("regName").value;
        const email = document.getElementById("regEmail").value;
        const password = document.getElementById("regPassword").value;

        if(!name || !email || !password) { alert("ದಯವಿಟ್ಟು ಎಲ್ಲಾ ವಿವರಗಳನ್ನು ತುಂಬಿರಿ!"); return; }

        const btn = document.getElementById("btnSendOtp");
        btn.innerText = "Sending OTP..."; btn.disabled = true;

        try {
            const response = await fetch('/send-signup-otp', {
                method: 'POST',
                headers: { 'Content-Type': 'application/json' },
                body: JSON.stringify({ email: email })
            });
            const data = await response.json();

            if (data.success) {
                alert(data.message);
                document.getElementById("step1").classList.add("hidden");
                document.getElementById("step2").classList.remove("hidden");
                document.getElementById("formMessage").innerText = "ನಿಮ್ಮ ಇಮೇಲ್‌ಗೆ OTP ಕಳುಹಿಸಲಾಗಿದೆ";
            } else {
                alert(data.message);
            }
        } catch (error) {
            alert("ಸರ್ವರ್ ಸಂಪರ್ಕಿಸುವಲ್ಲಿ ದೋಷ ಉಂಟಾಗಿದೆ.");
        }
        btn.innerText = "Send OTP (OTP ಪಡೆಯಿರಿ)"; btn.disabled = false;
    }

    async function verifyAndRegister() {
        const name = document.getElementById("regName").value;
        const email = document.getElementById("regEmail").value;
        const password = document.getElementById("regPassword").value;
        const otp = document.getElementById("signupOtp").value;

        if(!otp) { alert("ದಯವಿಟ್ಟು OTP ನಮೂದಿಸಿ!"); return; }

        const btn = document.getElementById("btnRegister");
        btn.innerText = "Verifying..."; btn.disabled = true;

        try {
            const response = await fetch('/verify-signup-otp', {
                method: 'POST',
                headers: { 'Content-Type': 'application/json' },
                body: JSON.stringify({ name: name, email: email, password: password, otp: otp })
            });
            const data = await response.json();

            if (data.success) {
                alert(data.message); // ಯಶಸ್ವಿ ಸಂದೇಶ
                window.location.href = "login.html"; // ಲಾಗಿನ್ ಪೇಜ್‌ಗೆ ಕಳುಹಿಸುವುದು
            } else {
                alert(data.message); // OTP ತಪ್ಪು ಸಂದೇಶ
            }
        } catch (error) {
            alert("ಸರ್ವರ್ ಸಂಪರ್ಕಿಸುವಲ್ಲಿ ದೋಷ ಉಂಟಾಗಿದೆ.");
        }
        btn.innerText = "Verify & Register (ಖಾತೆ ಸೃಷ್ಟಿಸಿ)"; btn.disabled = false;
    }
</script>

</body>
</html>
