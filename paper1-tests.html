<!DOCTYPE html>
<html lang="kn">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Paper 1 Tests - Chaithanya Career Academy</title>
    <style>
        body { font-family: Arial, sans-serif; background-color: #f4f4f9; margin: 0; padding: 40px; }
        .container { max-width: 1000px; margin: 0 auto; background: white; padding: 30px; border-radius: 10px; box-shadow: 0 0 15px rgba(0,0,0,0.05); }
        .section-title { color: #007bff; border-bottom: 2px solid #007bff; padding-bottom: 10px; margin-bottom: 25px; font-size: 24px; }
        
        .grid-container { display: grid; grid-template-columns: repeat(auto-fit, minmax(280px, 1fr)); gap: 20px; }
        .test-box { background: #fff; border: 1px solid #ddd; border-radius: 8px; padding: 20px; transition: 0.3s; }
        .test-box:hover { transform: translateY(-5px); box-shadow: 0 8px 15px rgba(0,0,0,0.1); border-color: #007bff; }
        .test-title { font-size: 18px; font-weight: bold; color: #333; margin-bottom: 15px; }
        .test-details { font-size: 15px; color: #555; line-height: 1.8; margin-bottom: 20px; }
        
        .btn-start { display: block; text-align: center; padding: 10px; background-color: #28a745; color: white; text-decoration: none; border-radius: 5px; font-weight: bold; transition: 0.3s; }
        .btn-start:hover { background-color: #218838; }
        .btn-locked { background-color: #6c757d; cursor: not-allowed; }
        .btn-back { display: inline-block; margin-bottom: 20px; color: #555; text-decoration: none; font-weight: bold; }
        .btn-back:hover { color: #007bff; }
    </style>
</head>
<body>
    <div class="container">
        <!-- ಹಿಂದಕ್ಕೆ ಹೋಗಲು ಬಟನ್ -->
        <a href="test-dashboard.html" class="btn-back">⬅️Back to Categories</a>
        
        <h2 class="section-title">📚 UGC NET Paper 1 - Mock Tests</h2>
        
        <div class="grid-container">
            <div class="test-box">
    <div class="test-title">Paper 1 - Mock Test 01</div>
    <div class="test-details">📝 ಒಟ್ಟು ಪ್ರಶ್ನೆಗಳು: 5 <br>⏱️ ಸಮಯ: 10 ನಿಮಿಷಗಳು <br>💯 ಅಂಕಗಳು: 10</div>
    
    <!-- ಇಲ್ಲಿ ನಾವು ಬಟನ್ ಸುತ್ತ id="test1-buttons" ಇರುವ div ಸೇರಿಸಿದ್ದೇವೆ -->
    <div id="test1-buttons">
        <a href="mocktest.html" class="btn-start">Start Test (ಪ್ರಾರಂಭಿಸಿ)</a>
    </div>
</div>
            
            <div class="test-box">
                <div class="test-title">Paper 1 - Mock Test 02</div>
                <div class="test-details">📝 ಒಟ್ಟು ಪ್ರಶ್ನೆಗಳು: 50 <br>⏱️ ಸಮಯ: 60 ನಿಮಿಷಗಳು <br>💯 ಅಂಕಗಳು: 100</div>
                <a href="mocktest2.html" class="btn-start">Start Test (ಪ್ರಾರಂಭಿಸಿ)</a>
            </div>
        </div>
    </div>
    <script>
    async function loadTests() {
        try {
            // ಡೇಟಾಬೇಸ್‌ನಿಂದ ಫಲಿತಾಂಶಗಳನ್ನು ತರುವುದು
            const response = await fetch('/get-my-results');
            
            if (response.status === 401) {
                window.location.href = "login.html";
                return;
            }

            const results = await response.json();

            // ನೆನಪಿರಲಿ: mocktest.html ನಲ್ಲಿ ನೀವು ಸೇವ್ ಮಾಡಿದ್ದ ಹೆಸರೇ ಇಲ್ಲೂ ಇರಬೇಕು
            const testNameToCheck = "PYUT 1: Business Environment"; 
            
            const test1Done = results.find(result => result.testName === testNameToCheck);

            if (test1Done) {
                // ಈಗಾಗಲೇ ಪರೀಕ್ಷೆ ಬರೆದಿದ್ದರೆ, ಹೊಸ 2 ಬಟನ್‌ಗಳನ್ನು ಹಾಕುವುದು
                document.getElementById('test1-buttons').innerHTML = `
                    <div style="display: flex; gap: 10px; width: 100%;">
                        <a href="mocktest.html" style="flex: 1; background: #dc3545; color: white; padding: 10px; border-radius: 5px; text-align: center; text-decoration: none; font-weight: bold;">Re-Attempt 🔄</a>
                        <a href="result.html?test=PYUT1" style="flex: 1; background: #17a2b8; color: white; padding: 10px; border-radius: 5px; text-align: center; text-decoration: none; font-weight: bold;">Result 📊</a>
                    </div>
                `;
            }
        } catch (error) {
            console.error("ಎರರ್:", error);
        }
    }

    window.onload = loadTests;
</script>
</body>
</html>
